# fly.toml — Fly.io deploy config for Pulsewatch.
#
# This is a template: `app` and the secrets below (DATABASE_URL,
# SECRET_KEY_BASE, and optionally ANTHROPIC_API_KEY) still need to be
# provisioned with `fly launch` / `fly secrets set` before `fly deploy`
# will work — none of that is safe to hardcode here.
app = "pulsewatch"
primary_region = "iad"

[build]

# `release_command` runs once, in its own short-lived machine, before
# the new version is rolled out to the long-running app machines — the
# standard place to run migrations so they always complete (or fail the
# deploy) ahead of any request hitting new code that expects the new
# schema. `bin/migrate` is the overlay script `mix phx.gen.release`
# generated, which calls `Pulsewatch.Release.migrate/0`.
[deploy]
  release_command = "/app/bin/migrate"

[env]
  PHX_HOST = "pulsewatch.fly.dev"
  PORT = "4000"
  # Fly's internal 6PN network resolves "<app-name>.internal" to every
  # machine running this app. dns_cluster (already in the supervision
  # tree) polls that name and connects any nodes it finds into one
  # Erlang cluster — this is what makes scaling past one machine
  # (`fly scale count 2`) actually multi-node instead of two isolated
  # instances. On its own that would mean every monitor gets checked
  # once per machine; `Pulsewatch.Monitoring.NodeLock` (Postgres
  # advisory locks) is what keeps only one machine actually running
  # each monitor's worker once they're clustered.
  DNS_CLUSTER_QUERY = "pulsewatch.internal"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
